[project]
name = "notebookmcp"
version = "0.1.0"
description = "A lean, fast MCP server that lets Claude Code and Codex ask your Google NotebookLM notebooks questions instead of loading documents into context."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rhys Ellwood" }]
keywords = ["mcp", "notebooklm", "claude-code", "codex", "model-context-protocol", "rag", "gemini-notebook"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=2.2,<3",
  "notebooklm-py[cookies]>=0.8.2,<1",
]

[project.optional-dependencies]
browser = ["notebooklm-py[browser]>=0.8.2,<1"]

[project.scripts]
notebookmcp = "notebookmcp.cli:main"

[project.urls]
Homepage = "https://github.com/REllwood/NotebookMCP"
Issues = "https://github.com/REllwood/NotebookMCP/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
